# Tests the template's own verification scripts (selftest/run.sh).
# Runs only in the template repo. Repos created from it skip this job and can delete this
# file together with selftest/.
name: selftest
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    if: ${{ github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: selftest/ts-sample/.nvmrc
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install sample project dependencies
        working-directory: selftest/ts-sample
        run: npm ci --no-audit --no-fund
      - name: shellcheck
        run: shellcheck -x scripts/*.sh scripts/profiles/*.sh selftest/run.sh
      - name: Run selftest
        run: selftest/run.sh
