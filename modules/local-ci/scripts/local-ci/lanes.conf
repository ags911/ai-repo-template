# Lanes and steps for scripts/local-ci/run.sh. One step per line:
#
#   lane    step     flags  command
#
# lane, step  letters, digits, - and _. Lanes run at the same time, each in its own
#             container with its own clone of the commit. Steps run in file order.
# flags       - for none, or net for a step that needs the network: it is retried
#             (LOCAL_CI_NET_TRIES). Mark only steps that download, such as installs.
# command     the rest of the line, run with `bash -o pipefail -c` at the clone's root.
#
# A step that passed is skipped on the next run at the same commit, and only the lane's
# volume (/work, holding the clone at /work/repo) outlives its container. So a later step
# may rely on files an earlier step left in /work, not on anything else it changed (see the
# ENV line in the Dockerfile). Keep each step safe to run twice: a failed or interrupted
# step runs again from the start.
#
# The lanes below mirror the template's ts and python verify profiles for a repo with both
# at the root. Delete the lane you don't use, set the folders (cd web && ...), and add your
# own checks. Every tool named here must be in the Dockerfile.

ts      install  net    npm ci --no-audit --no-fund
ts      lint     -      npm run lint
ts      types    -      npm run typecheck
ts      test     -      npm test

python  sync     net    uv sync --locked
python  ruff     -      uv run --locked python -m ruff check . && uv run --locked python -m ruff format --check .
python  mypy     -      uv run --locked python -m mypy .
python  pytest   -      uv run --locked python -m pytest
