name: Bug
description: Something behaves wrongly.
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands or actions, from a clean checkout if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual
      description: What should happen, what happens instead, and any error output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
