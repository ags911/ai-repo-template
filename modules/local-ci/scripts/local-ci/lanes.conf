# Authoritative profile scripts are shared with scripts/verify.sh.
# Provision dependencies first. Add only project-specific setup here, never a
# second copy of lint/type/test commands. Remove unused lanes explicitly.
ts      install  net    npm ci --no-audit --no-fund
ts      verify   -      bash scripts/profiles/ts.sh
python  sync     net    uv sync --locked
python  verify   -      bash scripts/profiles/python.sh
repo    verify   -      bash scripts/local-ci/repository.sh
# The repo lane runs all configured extra profiles and the suppression check.
