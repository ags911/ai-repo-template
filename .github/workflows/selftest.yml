# Tests the template's own verification scripts (selftest/run.sh).
# Runs only in the template repo. Repos created from it skip this job and can delete this
# file together with selftest/.
name: selftest
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a PR's older run when a newer commit arrives. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    if: ${{ github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: selftest/ts-sample/.nvmrc
          cache: npm
          cache-dependency-path: selftest/ts-sample/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install sample project dependencies
        working-directory: selftest/ts-sample
        run: npm ci --no-audit --no-fund
      - name: shellcheck
        run: shellcheck -x scripts/*.sh scripts/profiles/*.sh selftest/run.sh
      # actionlint checks workflow syntax and expressions (verify.yml never runs here);
      # zizmor checks workflow security. Pinned; bump both by hand.
      - name: Lint workflows
        run: |
          uvx --from actionlint-py==1.7.12.25 actionlint -no-color
          uvx zizmor==1.32.0 --offline .github/workflows
      - name: Run selftest
        run: selftest/run.sh

  # The skills module keeps skills in .agents/skills with symlinks in .claude/skills.
  # Proves the README's Windows advice: with core.symlinks on, every skill resolves;
  # without it, git writes the links as small text files.
  windows-symlinks:
    if: ${{ github.event.repository.is_template }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Turn on symlinks in git (the README's Windows step)
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every skill resolves through .claude/skills
        shell: bash
        run: |
          n=0
          for d in modules/skills/.agents/skills/*/; do
            s=$(basename "$d")
            f="modules/skills/.claude/skills/$s/SKILL.md"
            grep -q '^name: '"$s" "$f" || { echo "::error::$f does not resolve"; exit 1; }
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "::error::no skills found"; exit 1; }
          echo "$n skills resolve with core.symlinks=true"
      - name: Without symlinks the links are plain text files
        shell: bash
        run: |
          git -c core.symlinks=false clone -q "file://$PWD" ../nolinks
          link=../nolinks/modules/skills/.claude/skills/adr-builder
          [ -f "$link" ] && [ ! -d "$link" ] || { echo "::error::expected a plain file at $link"; exit 1; }
          echo "core.symlinks=false gives a text file containing: $(cat "$link")"
