name: verify
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a PR's older run when a newer commit arrives. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # GitHub's default is 360; a hung test would burn the free minutes
    steps:
      # Actions are pinned to full commit SHAs; the comment records the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # check-suppressions.sh needs the base commit
          persist-credentials: false

      # Profiles are matched as whole words: "secrets" must not count as "ts".
      - name: Read profiles
        id: cfg
        run: |
          source .verify.env
          # The upstream template has no profiles on purpose and tests itself with selftest/.
          # Decided by contents, not the "Template repository" setting, so a project that
          # later becomes a template keeps its verify.
          upstream=false
          if [ -z "${VERIFY_PROFILES// /}" ] && [ -f selftest/run.sh ]; then upstream=true; fi
          {
            echo "profiles=$VERIFY_PROFILES"
            echo "ts_dir=$TS_DIR"
            echo "py_dir=$PY_DIR"
            echo "upstream=$upstream"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: contains(format(' {0} ', steps.cfg.outputs.profiles), ' ts ')
        with:
          node-version-file: ${{ steps.cfg.outputs.ts_dir }}/.nvmrc
          # Caches npm's download cache when there is a package-lock.json.
          cache: ${{ hashFiles(format('{0}/package-lock.json', steps.cfg.outputs.ts_dir)) != '' && 'npm' || '' }}
          cache-dependency-path: ${{ steps.cfg.outputs.ts_dir }}/package-lock.json
      - name: Install JS dependencies
        if: contains(format(' {0} ', steps.cfg.outputs.profiles), ' ts ')
        working-directory: ${{ steps.cfg.outputs.ts_dir }}
        run: |
          if   [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ];      then corepack enable && yarn install --immutable
          else npm ci
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: contains(format(' {0} ', steps.cfg.outputs.profiles), ' python ')
        with:
          enable-cache: true
      - name: Install Python dependencies
        if: contains(format(' {0} ', steps.cfg.outputs.profiles), ' python ')
        working-directory: ${{ steps.cfg.outputs.py_dir }}
        run: uv sync --frozen

      - name: Install gitleaks
        if: contains(format(' {0} ', steps.cfg.outputs.profiles), ' secrets ')
        run: scripts/ci-install-tool.sh gitleaks
      - name: Install lychee
        if: contains(format(' {0} ', steps.cfg.outputs.profiles), ' links ')
        run: scripts/ci-install-tool.sh lychee

      - name: Verify
        if: steps.cfg.outputs.upstream != 'true'
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}  # all zeros on the first push to main
        run: |
          BASE_REF=$(scripts/ci-base-ref.sh)
          export BASE_REF
          echo "suppression check base: $BASE_REF"
          ./scripts/verify.sh
